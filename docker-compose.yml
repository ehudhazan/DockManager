# File: docker-compose.yml
#
# Host preparation (required):
#   * The image runs as uid/gid 64198 (distroless, non-root). Docker creates a
#     missing bind-mount directory as root:root, so the first run fails with
#     "Access to the path '/data/stacks' is denied". Pre-create the directory and
#     give it to the container's uid/gid:
#       mkdir -p data && sudo chown -R 64198:64198 data
#   * The container must be in the host's docker group to read the socket. Set
#     DOCKER_GID to the host's group id (getent group docker | cut -d: -f3) in
#     .env, or the default 999 below is used.
name: eh-dockmanager

services:
  eh-dockmanager:
    build:
      context: .
      args:
        # Build number for the date-based version; export BUILD_NUMBER, or use ./build.sh
        # which sets it to the git commit count. Empty falls back to a build-time clock value.
        BUILD_NUMBER: ${BUILD_NUMBER:-}
    image: eh-dockmanager:latest
    container_name: eh-dockmanager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - EHDM_DATA_DIR=/data
      - EHDM_HTTP_PORT=80
      - EHDM_PORTAL_PORT=443
      - EHDM_ADMIN_PORT=8443
      - EHDM_PORTAL_DOMAIN=${EHDM_PORTAL_DOMAIN:-dock.lan}
      - EHDM_LAN_IP=${EHDM_LAN_IP:-10.10.1.1}
      # First-run bootstrap administrator (only used when the users table is empty).
      - EHDM_ADMIN_USER=${EHDM_ADMIN_USER:-admin}
      - EHDM_ADMIN_PASSWORD=${EHDM_ADMIN_PASSWORD:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "/app/eh-dockmanager", "--health-probe"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
